[package]
name = "ebonhux-coeur"
edition.workspace = true
version.workspace = true

[lib]
name = "ebonhux_coeur"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
zeroize = "1"
time = { version = "0.3", features = ["formatting", "std"] }
ureq = "3"
zip = "5"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
keyring = "4"

[dev-dependencies]
tempfile = "3"
